<!-- task-detail.page.html -->
<div class="task-container" [style.padding-top]="safeAreaTop">
  <!-- Header -->
  <header class="header">
    <button class="back-btn" (click)="goBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <h1>Task Detail Screen</h1>
  </header>

  <main class="content">
    <!-- Top Subheader Info -->
    <div class="session-info-bar">
      <div class="session-left">
        <span class="sub-text">vs last leg day - 7 days ago</span>
        <strong class="main-title">PRIYA S. - LEG DAY</strong>
      </div>
      <div class="session-right">
        <span class="session-label">SESSION</span>
        <strong class="timer-value">38:42</strong>
      </div>
    </div>

    <!-- Quick Preview Cards -->
    <div class="preview-cards-row">
      <div class="preview-card">
        <span class="ex-name">Leg press</span>
        <span class="ex-stat">top 140 × 10</span>
      </div>
      <div class="preview-card">
        <span class="ex-name">Leg extension</span>
        <span class="ex-stat">top 55 × 10</span>
      </div>
    </div>

    <!-- Active Exercise Card with VS LAST toggle button -->
    <div class="active-exercise-card">
      <div class="exercise-header-row">
        <div class="ex-meta">
          <span class="set-label">EXERCISE 4 • SET 1</span>
          <div class="ex-title-row">
            <span class="current-exercise-name">Leg curl</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
        <button class="vs-last-btn" [class.active]="isVsLastActive" (click)="toggleVsLast()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          VS LAST
        </button>
      </div>
    </div>

    <!-- Counters Grid (Weight & Reps) -->
    <div class="counters-grid">
      <!-- Weight Counter -->
      <div class="counter-card">
        <span class="counter-title">WEIGHT</span>
        <strong class="counter-value">{{ weight }}</strong>
        <div class="slider-graphic">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <span class="counter-unit">kg</span>
        <div class="counter-actions">
          <button class="count-btn" (click)="decrementWeight()">−</button>
          <button class="count-btn" (click)="incrementWeight()">+</button>
        </div>
      </div>

      <!-- Reps Counter -->
      <div class="counter-card">
        <span class="counter-title">REPS</span>
        <strong class="counter-value">{{ reps }}</strong>
        <div class="slider-graphic">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <span class="counter-unit">reps</span>
        <div class="counter-actions">
          <button class="count-btn" (click)="decrementReps()">−</button>
          <button class="count-btn" (click)="incrementReps()">+</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav" [style.padding-bottom]="safeAreaBottom">
    <button class="nav-item" (click)="navigateTo('home')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item active" (click)="navigateTo('task')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Task</span>
    </button>
    <button class="nav-item" (click)="navigateTo('coaches')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5l11 11M6.5 17.5l11-11"/></svg>
      <span>Coaches</span>
    </button>
    <button class="nav-item" (click)="navigateTo('profile')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profile</span>
    </button>
  </nav>
</div>
