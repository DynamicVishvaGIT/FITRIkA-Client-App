
<ion-content class="ion-padding mobile-viewport-container" [scrollY]="false">
  <div class="auth-wrapper">

    <!-- Brand Logo Header -->
    <div class="brand-header">
      <div class="brand-logo-graphic">
        <img
          src="assets/images/logo.png"
          alt="HYYND Logo"
          class="brand-logo-img"
        />
      </div>
    </div>

    <!-- Hero Section -->
    <div class="hero-section">
      <h2 class="hero-heading">
        Your fitness,<br />
        personalized.
      </h2>

      <p class="hero-subtitle">
        Experience the precision of boutique coaching from the palm of your hand.
      </p>
    </div>

    <!-- Feature Cards -->
    <div class="features-row">
      <div class="feature-card">
        <div class="icon-wrap">
          <img
            src="assets/images/fast.png"
            alt="Fast Results"
            class="feature-icon-img"
          />
        </div>
        <span class="feature-text">Fast Results</span>
      </div>

      <div class="feature-card">
        <div class="icon-wrap">
          <img
            src="assets/images/smart.png"
            alt="Smart Data"
            class="feature-icon-img"
          />
        </div>
        <span class="feature-text">Smart Data</span>
      </div>
    </div>

    <!-- Phone Number or Email Input -->
    <div class="form-section">
      <label class="input-label">Phone Number or Email</label>

      <div class="input-box">
        <input
          type="text"
          class="custom-text-input"
          placeholder="Enter mobile number or email"
          [(ngModel)]="phoneNumber"
          autocomplete="username"
          (input)="onPhoneInput($event)"
        />
      </div>

      <div class="error-message" *ngIf="showError">
        Please enter a valid 10-digit mobile number or email address.
      </div>
    </div>

    <!-- Get Started Button -->
    <div class="action-footer">
      <ion-button
        expand="block"
        class="brand-solid-btn"
        (click)="proceedToOtp()"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? 'Sending OTP...' : 'Get Started' }}
      </ion-button>
    </div>

  </div>
</ion-content>
