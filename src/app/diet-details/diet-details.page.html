<!-- diet-details.page.html -->
<div class="diet-container">

  <header class="header">
    <button class="back-btn" (click)="goBack()" type="button" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <h1>Diet Details</h1>
  </header>

  <main class="content">

    <!-- Meal name -->
    <div class="main-meal-card">
      <h2>{{ meal?.name || 'Brown Rice & Grilled Chicken Bowl' }}</h2>
    </div>

    <!-- Macronutrients -->
    <div class="macros-grid">
      <div class="macro-card" *ngFor="let macro of macros">
        <span class="macro-title">{{ macro.name }}</span>
        <strong class="macro-value">{{ macro.value }}</strong>
        <div class="progress-bar"><div class="fill" [style.width.%]="macro.percent"></div></div>
      </div>
    </div>

    <!-- Micronutrients -->
    <h3 class="section-title">Micronutrients</h3>
    <div class="micro-grid">
      <div class="micro-card" *ngFor="let micro of micronutrients">
        <div class="micro-header">
          <span class="micro-name">{{ micro.name }}</span><span class="micro-percent" [style.color]="micro.color">{{ micro.percent }}</span>
        </div>
        <div class="progress-bar small">
          <div class="fill" [style.width]="micro.percent" [style.background]="micro.color"></div>
        </div>
        <span class="micro-sub">{{ micro.sub }}</span>
      </div>
    </div>

    <!-- Ingredients -->
    <div class="ingredients-container">
      <div class="ingredients-header">
        <h3>Ingredients</h3>
        <span class="serving-text">{{ meal?.serving || '1 serving' }}</span>
      </div>
      <div class="ingredient-item" *ngFor="let ing of ingredients">
        <span class="ing-name">{{ ing.name }}</span>
        <span class="ing-amount">{{ ing.amount }}</span>
      </div>
    </div>

  </main>

  <!-- Footer action -->
  <footer class="footer-action">
    <button class="action-btn" [class.completed]="isCompleted" (click)="markAsDone()" type="button">
      <span class="icon-circle-check">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </span>
      {{ isCompleted ? 'Meal completed!' : 'Mark lunch as done' }}
    </button>
  </footer>

</div>
