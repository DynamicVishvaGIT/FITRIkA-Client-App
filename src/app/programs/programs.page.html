<ion-content [fullscreen]="true" class="programs-content">
  <div class="mobile-container" [style.padding-top]="safeAreaTop" [style.padding-bottom]="safeAreaBottom">
    
    <!-- Header -->
    <header class="header">
      <button class="back-btn" (click)="goBack()" type="button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <h1>Programs</h1>
      <div class="header-spacer"></div>
    </header>

    <!-- Search Box -->
    <div class="search-filter-section">
      <div class="search-bar">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          placeholder="Search by name or specialty..." 
          [(ngModel)]="searchQuery" 
          (input)="filterPrograms()"
        />
      </div>
    </div>

    <!-- Programs List -->
    <div class="programs-list">
      <div class="program-card" *ngFor="let prog of filteredPrograms" (click)="openProgramDetail(prog)">
        <div class="card-header">
          <div class="card-profile-info">
            <img [src]="prog.image" [alt]="prog.name" class="trainer-avatar" />
            <div class="card-titles">
              <h3>{{ prog.name }}</h3>
              <p class="trainer-name">{{ prog.trainer }}</p>
            </div>
          </div>
          <span class="level-badge">{{ prog.level }}</span>
        </div>

        <div class="program-meta">
          <div class="meta-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>{{ prog.duration }}</span>
          </div>
        </div>

        <div class="tags-price-row">
          <div class="tags">
            <span class="tag" *ngFor="let t of prog.tags">{{ t }}</span>
          </div>
          <div class="price">
            <span class="amount">₹{{ prog.price | number }}</span>
            <span class="period">/mo</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</ion-content>
