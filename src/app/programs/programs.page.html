<!-- programs.page.html -->
<div class="programs-container" [style.padding-top]="safeAreaTop">
  <header class="header">
    <button class="back-btn" (click)="goBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <h1>Programs</h1>
  </header>

  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" placeholder="Search by name or specialty..." [(ngModel)]="searchQuery" (input)="filterPrograms()">
  </div>

  <div class="program-list">
    <div class="program-card" *ngFor="let prog of filteredPrograms" (click)="openProgramDetail(prog)">
      <div class="card-content">
        <img [src]="prog.image" alt="Trainer" class="trainer-avatar">
        <div class="details">
          <div class="title-row">
            <h3>{{ prog.name }}</h3>
            <span class="badge">{{ prog.level }}</span>
          </div>
          <p class="trainer-name">{{ prog.trainer }}</p>
          <div class="meta-row"><span>{{ prog.duration }}</span></div>
          <div class="tags-price-row">
            <div class="tags">
              <span class="tag" *ngFor="let t of prog.tags">{{ t }}</span>
            </div>
            <span class="price">₹{{ prog.price | number }}<small>/mo</small></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
