<div class="mobile-container">

  <div class="header">
    <button class="back-btn" (click)="goBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <h1>Find your trainer.</h1>
  </div>

  <div class="content">

    <div class="title-section">
      <h2>Find your trainer.</h2>
      <p>Choose how you want to start your fitness journey with us today.</p>
    </div>

    <div class="options-list">

      <!-- Expert Coaches -->
      <div
        class="option-card"
        [class.active]="selectedOptionType === 'expert'"
        (click)="selectOption('expert')">

        <div
          class="icon-box"
          [class.green]="selectedOptionType === 'expert'"
          [class.grey]="selectedOptionType !== 'expert'">

          <img
            src="assets/images/Overlay.png"
            alt="Expert Coaches"
            class="feature-icon-img">

        </div>

        <span class="option-title">
          Expert coaches
        </span>

      </div>

      <!-- Accountability Coaches -->
      <div
        class="option-card"
        [class.active]="selectedOptionType === 'accountability'"
        (click)="selectOption('accountability')">

        <div
          class="icon-box"
          [class.green]="selectedOptionType === 'accountability'"
          [class.grey]="selectedOptionType !== 'accountability'">

          <img
            src="assets/images/barbel.png"
            alt="Accountability Coaches"
            class="feature-icon-img">

        </div>

        <span class="option-title">
          Accountability Coaches
        </span>

      </div>

      <!-- Programs -->
      <div
        class="option-card"
        [class.active]="selectedOptionType === 'programs'"
        (click)="selectOption('programs')">

        <div
          class="icon-box"
          [class.green]="selectedOptionType === 'programs'"
          [class.grey]="selectedOptionType !== 'programs'">

          <img
            src="assets/images/shop.png"
            alt="Programs"
            class="feature-icon-img">

        </div>

        <span class="option-title">
          Programs
        </span>

      </div>

    </div>

  </div>

  

</div>
