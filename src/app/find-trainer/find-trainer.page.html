<div class="mobile-container">

  <!-- Header -->
  <div class="header">
    <button class="back-btn" (click)="goBack()" type="button" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <h1>Find your trainer.</h1>
  </div>

  <div class="content">

    <div class="title-section">
      <h2>Find your trainer.</h2>
      <p>Choose how you want to start your fitness journey with us today.</p>
    </div>

    <div class="options-list">

      <!-- Expert Coaches -->
      <div class="option-card" [class.active]="selectedOptionType === 'expert'" (click)="selectOption('expert')">
        <div class="icon-box" [class.green]="selectedOptionType === 'expert'" [class.grey]="selectedOptionType !== 'expert'">
          <img src="assets/images/Overlay.png" alt="Expert Coaches" class="feature-icon-img">
        </div>
        <span class="option-title">Expert coaches</span>
      </div>

      <!-- Accountability Coaches -->
      <div class="option-card" [class.active]="selectedOptionType === 'accountability'" (click)="selectOption('accountability')">
        <div class="icon-box" [class.green]="selectedOptionType === 'accountability'" [class.grey]="selectedOptionType !== 'accountability'">
          <img src="assets/images/barbel.png" alt="Accountability Coaches" class="feature-icon-img">
        </div>
        <span class="option-title">Accountability Coaches</span>
      </div>

      <!-- Programs -->
      <div class="option-card" [class.active]="selectedOptionType === 'programs'" (click)="selectOption('programs')">
        <div class="icon-box" [class.green]="selectedOptionType === 'programs'" [class.grey]="selectedOptionType !== 'programs'">
          <img src="assets/images/shop.png" alt="Programs" class="feature-icon-img">
        </div>
        <span class="option-title">Programs</span>
      </div>

    </div>

    <!-- OR divider -->
    <div class="or-divider">
      <span class="line"></span>
      <span class="or-text">OR</span>
      <span class="line"></span>
    </div>

    <!-- Invite link row -->
    <div class="share-row">
      <svg class="share-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <span class="share-text">{{ inviteLink }}</span>
      <button class="square-btn" type="button" (click)="copyLink()" aria-label="Copy link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
      <button class="square-btn" type="button" (click)="shareLink()" aria-label="Share link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h11"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
    </div>

  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <button class="nav-item" type="button" (click)="navigateTo('home')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path>
      </svg>
      <span>Home</span>
    </button>
    <button class="nav-item active" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="17" rx="3" fill="currentColor" fill-opacity="0.15"></rect>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
        <line x1="8" y1="14" x2="8.01" y2="14"></line>
        <line x1="12" y1="14" x2="12.01" y2="14"></line>
        <line x1="16" y1="14" x2="16.01" y2="14"></line>
      </svg>
      <span>Task</span>
    </button>
    <button class="nav-item" type="button" (click)="navigateTo('coaches')">
      <svg class="dumbbell" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"></path>
      </svg>
      <span>Coaches</span>
    </button>
    <button class="nav-item" type="button" (click)="navigateTo('profile')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"></path>
      </svg>
      <span>Profile</span>
    </button>
  </div>

</div>
