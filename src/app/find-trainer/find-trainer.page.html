<div class="mobile-container">
  <div class="header">
    <button class="back-btn" (click)="goBack()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <h1>Find your trainer.</h1>
  </div>

  <div class="content">
    <div class="title-section">
      <h2>Find your trainer.</h2>
      <p>Choose how you want to start your fitness journey with us today.</p>
    </div>

    <div class="options-list">
      <div class="option-card active" (click)="selectOption('expert')">
        <div class="icon-box green">
           <img src="assets/images/Overlay.png" alt="Swap Task" class="feature-icon-img" />
        </div>
        <span class="option-title">Expert coaches</span>
      </div>

      <div class="option-card" (click)="selectOption('accountability')">
        <div class="icon-box grey">
           <img src="assets/images/barbel.png" alt="Swap Task" class="feature-icon-img" />
        </div>
        <span class="option-title">Accountability Coaches</span>
      </div>

      <div class="option-card" (click)="selectOption('programs')">
        <div class="icon-box grey">
           <img src="assets/images/shop.png" alt="Swap Task" class="feature-icon-img" />
        </div>
        <span class="option-title">Programs</span>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item" (click)="navigateTo('home')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Home</span>
    </button>
    <button class="nav-item active" (click)="navigateTo('task')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>Task</span>
    </button>
    <button class="nav-item" (click)="navigateTo('coaches')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6.5 6.5l11 11M6.5 17.5l11-11M2 12h3M19 12h3M12 2v3M12 19v3"/>
      </svg>
      <span>Coaches</span>
    </button>
    <button class="nav-item" (click)="navigateTo('profile')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Profile</span>
    </button>
  </div>
</div>
