<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>User Directory</ion-title>
    
    <!-- Top Right Add Button -->
    <ion-buttons slot="end">
      <ion-button (click)="openAddModal()">
        <ion-icon name="add-circle-outline" slot="start"></ion-icon>
        Add
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- List of User Cards -->
  <ion-grid class="ion-no-padding">
    <ion-row>
      <ion-col size="12" *ngFor="let user of users">
        <ion-card class="user-card">
          <ion-card-content class="card-body">
            
            <!-- User Info (Name & Age) -->
            <div class="user-info">
              <div class="user-avatar">
                {{ user.name.charAt(1) }}
              </div>
              <div class="details">
                <h3 class="user-name">{{ user.name }}</h3>
                <p class="user-age">Age: <span>{{ user.age }}</span></p>
              </div>
            </div>

            <!-- Side Action Buttons -->
            <div class="action-buttons">
              <ion-button fill="clear" color="primary" (click)="openEditModal(user)">
                <ion-icon name="create-outline" slot="icon-only"></ion-icon>
              </ion-button>
              <ion-button fill="clear" color="danger" (click)="deleteUser(user.id)">
                <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
              </ion-button>
            </div>

          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Oval Bottom Sheet Modal -->
  <ion-modal 
    class="oval-bottom-sheet"
    [isOpen]="isModalOpen" 
    [breakpoints]="[0, 0.5, 0.8]" 
    [initialBreakpoint]="0.5" 
    (ionModalDidDismiss)="closeModal()">
    
    <ng-template>
      <ion-header class="ion-no-border sheet-header">
        <ion-toolbar>
          <!-- Dynamic Header Title -->
          <ion-title>{{ isEditMode ? 'Edit User' : 'Add User' }}</ion-title>
          
          <!-- Only Cross/Close Icon -->
          <ion-buttons slot="end">
            <ion-button (click)="closeModal()">
              <ion-icon name="close-outline" slot="icon-only" class="close-icon"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding sheet-content">
        
        <!-- Form using Template-driven approach -->
        <form (ngSubmit)="saveUser()">
          <!-- Name Input -->
          <ion-item class="custom-input" lines="none">
            <ion-label position="stacked">Name</ion-label>
            <ion-input type="text" placeholder="Enter name" [(ngModel)]="userName" name="userName" required></ion-input>
          </ion-item>

          <!-- Age Input -->
          <ion-item class="custom-input" lines="none">
            <ion-label position="stacked">Age</ion-label>
            <ion-input type="number" placeholder="Enter age" [(ngModel)]="userAge" name="userAge" required></ion-input>
          </ion-item>

          <!-- Dynamic Action Button -->
          <ion-button 
            expand="block" 
            type="submit" 
            [disabled]="!userName || !userAge" 
            class="submit-btn ion-margin-top">
            {{ isEditMode ? 'Edit User' : 'Add User' }}
          </ion-button>
        </form>

      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
