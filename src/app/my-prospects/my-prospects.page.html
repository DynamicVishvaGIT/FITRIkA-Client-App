<ion-content [fullscreen]="true" class="trainer-content">
  <div class="mobile-container">

    <!-- Header -->
    <div class="header">
      <button class="back-btn" (click)="goBack()" type="button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <h1>Already Have Trainer</h1>
      <div class="header-spacer"></div>
    </div>

    <!-- Intro -->
    <div class="intro">
      <h2>I already have a trainer</h2>
      <p>Search for your trainer by name or scan their unique invite code to connect instantly.</p>
    </div>

    <!-- Paste link card -->
    <div class="link-card">
      <div class="link-card-top">
        <div class="icon-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </div>
        <div class="link-card-text">
          <div class="title-row">
            <h3>Paste trainer's link</h3>
            <span class="quick-badge">QUICK ADD</span>
          </div>
          <p>Got an app link from your coach? Paste it here to link profiles directly.</p>
        </div>
      </div>

      <div class="link-input">
        <svg class="globe-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <input type="text" placeholder="e.g. hyynd.app/t/alex-fit" [(ngModel)]="trainerLink" />
        <button class="paste-btn" type="button" (click)="pasteLink()">Paste</button>
      </div>
    </div>

    <!-- OR divider -->
    <div class="or-divider">
      <span class="line"></span>
      <span class="or-text">OR</span>
      <span class="line"></span>
    </div>

    <!-- Shareable link row -->
    <div class="share-row">
      <svg class="share-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <span class="share-text">{{ inviteLink }}</span>
      <button class="square-btn" type="button" (click)="shareLink()" aria-label="Share link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"></path>
          <polyline points="16 6 12 2 8 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="15"></line>
        </svg>
      </button>
      <button class="square-btn" type="button" (click)="copyLink()" aria-label="Copy link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button class="continue-btn" type="button" (click)="onContinue()">
        <span>Continue</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
      <button class="browse-link" type="button" (click)="browseCoaches()">
        I don't have a trainer, browse community coaches
      </button>
    </div>

  </div>
</ion-content>
