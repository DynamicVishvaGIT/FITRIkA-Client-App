<ion-content [fullscreen]="true" class="modal-content">
  <div class="modal-card-wrapper">
    
    <!-- Header Title & Close -->
    <div class="modal-header">
      <h2>How did You Have?</h2>
      <button class="close-btn" (click)="dismissModal()" type="button">
        <ion-icon name="close"></ion-icon>
      </button>
    </div>

    <!-- Planned Meal Info Box -->
    <div class="planned-meal-box">
      <span class="label-muted">PLANNED MEAL</span>
      <h4>{{ mealData.title }}</h4>
      <span class="calories-text">{{ mealData.calories }}</span>
    </div>

    <!-- Selection Section with Dropdown & Preview Card -->
    <div class="selection-section">
      <span class="label-muted">YOU HAD</span>
      
      <!-- Dropdown Input Field using Popover Interface -->
      <div class="custom-dropdown-wrap">
        <ion-select 
          [(ngModel)]="selectedAlternativeMeal" 
          (ionChange)="onDropdownChange($event)" 
          interface="popover" 
          class="ionic-dropdown">
          <ion-select-option *ngFor="let item of mealOptions" [value]="item.name">
            {{ item.name }}
          </ion-select-option>
        </ion-select>
      </div>

      <!-- Preview Card with Working Pencil Edit Functionality -->
      <div class="preview-selected-card">
        <div class="preview-text" *ngIf="!isEditing">
          <h4>{{ selectedAlternativeMeal }}</h4>
          <span class="calc-tag">Rough calories: ~{{ selectedCalories }}</span>
        </div>
        
        <!-- Inline Editing View when Pencil is clicked -->
        <div class="preview-edit-mode" *ngIf="isEditing">
          <input type="text" [(ngModel)]="selectedAlternativeMeal" class="edit-input-field" />
          <button class="save-btn" (click)="isEditing = false" type="button">Done</button>
        </div>

        <button class="edit-icon-btn" (click)="toggleEdit()" title="Edit meal" type="button">
          <ion-icon name="pencil-outline"></ion-icon>
        </button>
      </div>
    </div>

    <!-- Note Input Field -->
    <div class="input-group-field">
      <label class="label-muted">Note for Rohan (optional)</label>
      <textarea 
        [(ngModel)]="swapNote" 
        placeholder="Explain why you swapped or add details..."
        rows="3"
        class="note-textarea">
      </textarea>
    </div>

    <!-- Submit Action Button -->
    <div class="action-footer">
      <button class="primary-action-btn" (click)="logSwap()" type="button">
        Log Swap for Lunch
      </button>
    </div>

  </div>
</ion-content>
