<ion-content [fullscreen]="true" class="modal-content">
  <div class="modal-card-wrapper">
    
    <!-- Header Title & Close -->
    <div class="modal-header">
      <h2>How did You Have?</h2>
      <button class="close-btn" (click)="dismissModal()" type="button">
        <ion-icon name="close"></ion-icon>
      </button>
    </div>

    <!-- Planned Meal Info Box -->
    <div class="planned-meal-box">
      <span class="label-muted">PLANNED MEAL</span>
      <h4>{{ mealData.title }}</h4>
      <span class="calories-text">{{ mealData.calories }}</span>
    </div>

    <!-- Selection Section with Custom Responsive Dropdown Directly Below -->
    <div class="selection-section">
      <span class="label-muted">YOU HAD</span>
      
      <!-- Trigger / Input Box for Custom Dropdown -->
      <div class="custom-dropdown-container" [class.open]="isDropdownOpen">
        <div class="dropdown-trigger-box" (click)="toggleDropdown()">
          <span class="selected-text">{{ selectedAlternativeMeal || 'Select meal' }}</span>
          <ion-icon name="chevron-down-outline" class="dropdown-arrow"></ion-icon>
        </div>

        <!-- Responsive Dropdown List Positioned Directly Below -->
        <div class="dropdown-options-list" *ngIf="isDropdownOpen">
          <div 
            class="dropdown-option-item" 
            *ngFor="let item of mealOptions" 
            (click)="selectMealOption(item)">
            <span class="option-name">{{ item.name }}</span>
            <span class="option-calories">~{{ item.calories }} kcal</span>
          </div>
        </div>
      </div>

      <!-- Preview Displayed Directly Without Card Background/Container -->
      <div class="preview-selected-inline">
        <div class="preview-text" *ngIf="!isEditing">
          <h4>{{ selectedAlternativeMeal || 'No meal selected' }}</h4>
          <span class="calc-tag">Rough calories: ~{{ selectedCalories }}</span>
        </div>
        
        <!-- Inline Editing View when Pencil is clicked -->
        <div class="preview-edit-mode" *ngIf="isEditing">
          <input type="text" [(ngModel)]="selectedAlternativeMeal" class="edit-input-field" />
          <button class="save-btn" (click)="isEditing = false" type="button">Done</button>
        </div>

        <button class="edit-icon-btn" (click)="toggleEdit()" title="Edit meal" type="button">
          <img src="assets/images/pen.png" alt="Swap Task" class="feature-icon-img" style="margin-right: 18px;" />
        </button>
      </div>
    </div>

    <!-- Note Input Field -->
    <div class="input-group-field">
      <label class="label-muted">Note for Rohan (optional)</label>
      <textarea 
        [(ngModel)]="swapNote" 
        placeholder="Explain why you swapped or add details..."
        rows="3"
        class="note-textarea">
      </textarea>
    </div>

    <!-- Submit Action Button -->
    <div class="action-footer">
      <button class="primary-action-btn" (click)="logSwap()" type="button">
        Log Swap for Lunch
      </button>
    </div>

  </div>
</ion-content>
