<!-- how-did.page.html -->
<div class="modal-card-wrapper">

  <div class="sheet-handle"></div>

  <!-- Header: title + close -->
  <div class="modal-header">
    <h2>{{ mealData.modalTitle }}</h2>
    <button class="close-btn" (click)="dismissModal()" type="button" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Planned meal / workout -->
  <div class="planned-meal-box">
    <span class="label-muted">{{ isWorkout ? 'PLANNED WORKOUT' : 'PLANNED MEAL' }}</span>
    <h4>{{ mealData.title }}</h4>
    <span class="calories-text" [class.small]="isWorkout">{{ isWorkout ? mealData.subtitle : mealData.calories }}</span>
  </div>

  <!-- Options -->
  <div class="options-stack">
    <button type="button" class="option-card" *ngFor="let opt of options"
            [class.selected]="selectedOption === opt.key" (click)="selectOption(opt.key)">

      <span class="icon-circle">
        <ng-container [ngSwitch]="opt.icon">

          <svg *ngSwitchCase="'check'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.801 10A10 10 0 1 1 17 3.335"></path>
            <path d="m9 11 3 3L22 4"></path>
          </svg>

          <svg *ngSwitchCase="'edit'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"></path>
          </svg>

          <svg *ngSwitchCase="'ban'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <line x1="5.6" y1="5.6" x2="18.4" y2="18.4"></line>
          </svg>

          <!-- <svg *ngSwitchCase="'play'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <polygon points="10.2 8.6 16 12 10.2 15.4" fill="currentColor" stroke="none"></polygon>
          </svg> -->

          <svg *ngSwitchCase="'play'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.801 10A10 10 0 1 1 17 3.335"></path>
            <path d="m9 11 3 3L22 4"></path>
          </svg>

        </ng-container>
      </span>

      <span class="option-label">{{ opt.label }}</span>
    </button>
  </div>

</div>
