<ion-content [fullscreen]="true" class="modal-content">
  <div class="modal-card-wrapper">
    
    

    <!-- Header Title & Close Icon -->
    <div class="modal-header">
      <h2>{{ mealData.modalTitle }}</h2>
      <button class="close-btn" (click)="dismissModal()" type="button">
        <ion-icon name="close"></ion-icon>
      </button>
    </div>

    <!-- Planned Meal Info Box -->
    <div class="planned-meal-box">
      <span class="label-muted">PLANNED MEAL</span>
      <h4>{{ mealData.title }}</h4>
      <span class="calories-text">{{ mealData.calories }}</span>
    </div>

    <!-- Selection Options Stack -->
    <div class="options-stack">
      
      <!-- Option 1: Ate as planned -->
      <div 
        class="option-card" 
        [class.selected]="selectedOption === 'planned'"
        (click)="selectOption('planned')">
        <div class="option-left">
          <div class="icon-circle" [class.active-green-bg]="selectedOption === 'planned'">
            <img src="assets/images/Container.png" alt="Swap Task" class="feature-icon-img" />
          </div>
          <span>Ate as planned</span>
        </div>
        <div class="radio-check-wrap">
          <ion-icon *ngIf="selectedOption === 'planned'" name="checkmark-circle" class="checked-green"></ion-icon>
          <ion-icon *ngIf="selectedOption !== 'planned'" name="chevron-forward-outline" class="arrow-icon"></ion-icon>
        </div>
      </div>

      <!-- Option 2: Ate something else -->
      <div 
        class="option-card" 
        [class.selected]="selectedOption === 'else'"
        (click)="selectOption('else')">
        <div class="option-left">
          <div class="icon-circle" [class.active-green-bg]="selectedOption === 'else'">
             <img src="assets/images/Icon.png" alt="Swap Task" class="feature-icon-img" />
          </div>
          <span>Ate something else</span>
        </div>
        <div class="radio-check-wrap">
          <ion-icon *ngIf="selectedOption === 'else'" name="checkmark-circle" class="checked-green"></ion-icon>
          <ion-icon *ngIf="selectedOption !== 'else'" name="chevron-forward-outline" class="arrow-icon"></ion-icon>
        </div>
      </div>

      <!-- Option 3: Skipped the meal -->
      <div 
        class="option-card" 
        [class.selected]="selectedOption === 'skipped'"
        (click)="selectOption('skipped')">
        <div class="option-left">
          <div class="icon-circle" [class.active-green-bg]="selectedOption === 'skipped'">
            <ion-icon name="ban-outline"></ion-icon>
          </div>
          <span>Skipped the meal</span>
        </div>
        <div class="radio-check-wrap">
          <ion-icon *ngIf="selectedOption === 'skipped'" name="checkmark-circle" class="checked-green"></ion-icon>
          <ion-icon *ngIf="selectedOption !== 'skipped'" name="chevron-forward-outline" class="arrow-icon"></ion-icon>
        </div>
      </div>

    </div>

    <!-- Bottom Action Button -->
    <div class="action-footer">
      <button class="primary-action-btn" (click)="proceedNext()" type="button">
        {{ selectedOption === 'else' ? 'Continue' : 'Move To Another Time' }}
      </button>
    </div>

  </div>
</ion-content>
