<!-- how-did.page.html -->
<div>
  <!-- Background Dashboard Snapshot -->
  <!-- <div class="dashboard-background">
    <header class="header">
      <div class="greeting-box">
        <h2>Good morning, Aryan</h2>
        <p>You're making great progress this week!</p>
      </div>
    </header>
  </div> -->

  <!-- Bottom Sheet Overlay -->
  <div class="bottom-sheet" [style.padding-bottom]="safeAreaBottom">
    <div class="sheet-handle"></div>
    
    <div class="sheet-header">
      <h3>How did lunch go?</h3>
      <button class="close-btn" (click)="closeSheet()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Planned Meal Summary Box -->
    <div class="planned-meal-box">
      <span class="label">PLANNED MEAL</span>
      <strong>{{ currentMeal?.name || 'Brown rice + chicken + salad' }}</strong>
      <span class="calories">{{ currentMeal?.calories || '620 kcal' }}</span>
    </div>

    <!-- Options List -->
    <div class="options-list">
      <div class="option-card" (click)="selectOption('planned')">
        <div class="icon-circle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="option-text">Ate as planned</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>

      <div class="option-card highlight" (click)="selectOption('else')">
        <div class="icon-circle green">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </div>
        <span class="option-text">Ate something else</span>
        <div class="check-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00c853" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </div>

      <div class="option-card" (click)="selectOption('skipped')">
        <div class="icon-circle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
        </div>
        <span class="option-text">Skipped the meal</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>

    <!-- Action Button -->
    <button class="primary-btn" (click)="moveAnotherTime()">Move To Another Time</button>
  </div>
</div>
