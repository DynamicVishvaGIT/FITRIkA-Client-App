<div class="mobile-container" [class.filter-open]="isFilterOpen">

  <!-- Header -->
  <div class="header">
    <button class="back-btn" (click)="goBack()" type="button" aria-label="Back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </button>
    <h1>Find your trainer.</h1>
    <button class="add-top-btn" (click)="onAddClick()" type="button">Add</button>
  </div>

  <!-- Search & Categories -->
  <div class="search-filter-section">
    <div class="search-bar">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        type="text"
        placeholder="Search by name or specialty..."
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
      />
      <button class="filter-icon-btn" (click)="toggleFilter(true)" type="button" aria-label="Filters">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="21" x2="4" y2="14"></line>
          <line x1="4" y1="10" x2="4" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12" y2="3"></line>
          <line x1="20" y1="21" x2="20" y2="16"></line>
          <line x1="20" y1="12" x2="20" y2="3"></line>
          <line x1="1" y1="14" x2="7" y2="14"></line>
          <line x1="9" y1="8" x2="15" y2="8"></line>
          <line x1="17" y1="16" x2="23" y2="16"></line>
        </svg>
        <span *ngIf="getActiveFilterCount() > 0" class="filter-badge">{{ getActiveFilterCount() }}</span>
      </button>
    </div>

    <div class="category-banners-scroll">
      <button type="button" class="banner-chip" [class.active]="selectedCategory === 'All'" (click)="selectCategory('All')">All Trainers</button>
      <button type="button" class="banner-chip" [class.active]="selectedCategory === 'Strength'" (click)="selectCategory('Strength')">Strength</button>
      <button type="button" class="banner-chip" [class.active]="selectedCategory === 'Yoga'" (click)="selectCategory('Yoga')">Yoga</button>
      <button type="button" class="banner-chip" [class.active]="selectedCategory === 'Nutrition'" (click)="selectCategory('Nutrition')">Nutrition</button>
      <button type="button" class="banner-chip" [class.active]="selectedCategory === 'Running'" (click)="selectCategory('Running')">Running</button>
    </div>
  </div>

  <!-- Coaches List -->
  <div class="coaches-list">
    <div class="coach-card" *ngFor="let coach of filteredCoaches" (click)="viewProfile(coach)">
      <div class="coach-header">
        <div class="coach-profile-info">
          <img [src]="coach.image" [alt]="coach.name" class="coach-avatar" />
          <div class="coach-titles">
            <h3>{{ coach.name }}</h3>
            <div class="tags">
              <span class="tag" *ngFor="let tag of coach.tags">{{ tag }}</span>
            </div>
          </div>
        </div>
        <span class="rating-badge">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          <span>{{ coach.rating | number: '1.1-1' }}</span>
        </span>
      </div>

      <div class="coach-meta">
        <div class="meta-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
            <polyline points="3 3 3 8 8 8"></polyline>
            <polyline points="12 7 12 12 15 14"></polyline>
          </svg>
          <span>{{ coach.experience }} yrs exp</span>
        </div>
        <div class="meta-item">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span>{{ coach.location }}</span>
        </div>
      </div>

      <div class="price">
        <span class="amount">₹{{ coach.price | number }}</span>
        <span class="period">/mo</span>
      </div>
    </div>
  </div>

  <!-- Backdrop for Bottom Sheet -->
  <div class="backdrop" *ngIf="isFilterOpen" (click)="toggleFilter(false)"></div>

  <!-- Filter Bottom Sheet -->
  <div class="filter-bottom-sheet" [class.open]="isFilterOpen">
    <div class="sheet-handle"></div>

    <div class="sheet-header">
      <h2>Filters</h2>
      <button class="clear-btn" (click)="clearFilters()" type="button">Clear</button>
      <button class="close-btn" (click)="toggleFilter(false)" type="button" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="sheet-content">
      <div class="filter-section">
        <h3>Specialty</h3>
        <div class="chip-grid">
          <button type="button" *ngFor="let spec of specialtyOptions" class="filter-chip"
            [class.selected]="selectedSpecialties.includes(spec)" (click)="toggleSpecialty(spec)">
            <span>{{ spec }}</span>
          </button>
        </div>
      </div>

      <div class="filter-section">
        <h3>Goal</h3>
        <div class="chip-grid">
          <button type="button" *ngFor="let goal of goalOptions" class="filter-chip"
            [class.selected]="selectedGoals.includes(goal)" (click)="toggleGoal(goal)">
            <span>{{ goal }}</span>
          </button>
        </div>
      </div>
    </div>

    <div class="sheet-footer">
      <button class="apply-filter-btn" (click)="applyFilters()" type="button">Apply Filter</button>
    </div>
  </div>

</div>
